name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust@stable

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --locked

      - name: Build Tauri app
        run: |
          cargo tauri build --bundles none 2>&1 || true
          # Get the exe path
          find src-tauri/target/release/bundle -name "*.exe" -type f 2>/dev/null || echo "no exe found"

      - name: Upload Windows .exe
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gestor-pastas-militares-exe
          path: |
            src-tauri/target/release/bundle/exe/**/*.exe
            src-tauri/target/release/*.exe
          retention-days: 30

      - name: Upload Linux deb
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gestor-pastas-militares-deb
          path: src-tauri/target/release/bundle/deb/**/*.deb
          retention-days: 30

      - name: Upload macOS app
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gestor-pastas-militares-dmg
          path: src-tauri/target/release/bundle/dmg/**/*.dmg
          retention-days: 30